<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Not Found</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* Базовый стиль для фальшивой 404 */
        body { margin: 0; padding: 0; background-color: #fff; color: #000; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Стили для 404 */
        #view-404 { text-align: center; padding-top: 10vh; }
        #view-404 h1 { font-size: 2em; margin-bottom: 10px; }
        #view-404 p { color: #666; }

        /* Стили для реального приложения (изначально скрыто) */
        .app-theme { background-color: #0a0a0c; color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .view { display: none; }
        .view.active { display: block; }
        .view.active-flex { display: flex; }

        /* Окно инвайта и входа */
        .auth-box {
            background: #15151a; border: 1px solid #2c2c35; border-radius: 12px;
            padding: 30px; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .auth-box h2 { margin: 0 0 10px 0; font-size: 1.2em; text-align: center; color: #5e5ce6; }
        .auth-box p { font-size: 0.9em; color: #8a8a93; text-align: center; margin-top: -5px;}
        .auth-box input {
            background: #0a0a0c; border: 1px solid #33333d; color: #fff;
            padding: 12px; border-radius: 8px; font-size: 1em; outline: none; transition: 0.2s;
        }
        .auth-box input:focus { border-color: #5e5ce6; }
        .auth-box button {
            background: #5e5ce6; color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .auth-box button:hover { background: #4b49b8; }
        
        /* Временный дашборд */
        #view-app { flex-direction: column; text-align: center; gap: 20px;}
        #view-app button.btn-danger { background: rgba(255,69,58,0.1); color: #ff453a; border: 1px solid rgba(255,69,58,0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="view-404" class="view active">
        <h1>404 Not Found</h1>
        <p>nginx</p>
    </div>

    <div id="view-invite" class="view">
        <div class="auth-box">
            <h2>Активация доступа</h2>
            <p>Секретный токен принят. Создайте локальный ключ шифрования (пароль), чтобы войти в систему.</p>
            <input type="text" id="reg-username" placeholder="Придумайте никнейм">
            <input type="password" id="reg-password" placeholder="Придумайте надежный пароль">
            <button id="btn-register">Зашифровать и Войти</button>
        </div>
    </div>

    <div id="view-app" class="view">
        <h2>🔒 Секретный Дашборд (В разработке)</h2>
        <p>Вы успешно авторизованы. Ваш ключ находится в памяти браузера.</p>
        <button class="btn-danger" id="btn-logout">Стереть ключи и выйти</button>
    </div>

    <script>
        // --- 1. FIREBASE ИНИЦИАЛИЗАЦИЯ ---
        const firebaseConfig = {
            apiKey: "AIzaSyAzCfA19BfslrhUnFBYOG72Gnd5lm_5YtI",
            authDomain: "global-student-project.firebaseapp.com",
            projectId: "global-student-project",
            storageBucket: "global-student-project.firebasestorage.app",
            messagingSenderId: "847057162581",
            appId: "1:847057162581:web:a49a07368e7173871b1fdc",
            databaseURL: "https://global-student-project-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. КРИПТОГРАФИЯ (Хэширование) ---
        // Превращает любой текст в необратимый SHA-256 хэш
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- 3. РОУТЕР И ZERO TRUST ЛОГИКА ---
        const view404 = document.getElementById('view-404');
        const viewInvite = document.getElementById('view-invite');
        const viewApp = document.getElementById('view-app');
        
        let currentInviteHash = null;

        function showView(viewElement, isAppTheme = false) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active', 'active-flex'));
            if (isAppTheme) {
                document.body.classList.add('app-theme');
                document.title = "Ghost Platform";
                viewElement.classList.add('active-flex');
            } else {
                document.body.classList.remove('app-theme');
                document.title = "404 Not Found";
                viewElement.classList.add('active');
            }
        }

        // Главный маршрутизатор
        async function handleRoute() {
            const hash = window.location.hash;

            // Если есть локальный ключ (пользователь уже зареган)
            if (localStorage.getItem('ghost_session') && hash !== '#/app') {
                window.location.hash = '#/app';
                return;
            }

            // Сценарий А: Открыт Секретный Инвайт
            if (hash.startsWith('#/inv/')) {
                const token = hash.replace('#/inv/', '');
                const hashedToken = await sha256(token);
                
                try {
                    // Проверяем, есть ли такой хэш инвайта в базе
                    const snap = await db.ref(`invites/${hashedToken}`).once('value');
                    if (snap.exists()) {
                        currentInviteHash = hashedToken;
                        showView(viewInvite, true);
                    } else {
                        throw new Error("Invalid");
                    }
                } catch (e) {
                    // Если инвайт удален, неверный или база выдала ошибку
                    showView(view404, false);
                }
            } 
            // Сценарий Б: Дашборд
            else if (hash === '#/app') {
                if (localStorage.getItem('ghost_session')) {
                    showView(viewApp, true);
                } else {
                    window.location.hash = ''; // Сброс
                }
            } 
            // Сценарий В: Пустой или левый URL
            else {
                showView(view404, false);
            }
        }

        // Слушаем изменения URL и запускаем при загрузке
        window.addEventListener('hashchange', handleRoute);
        handleRoute();

        // --- 4. РЕГИСТРАЦИЯ ПО ИНВАЙТУ ---
        document.getElementById('btn-register').addEventListener('click', async () => {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            
            if (user.length < 3 || pass.length < 6) {
                alert("Имя от 3 символов, пароль от 6 символов.");
                return;
            }

            const userHash = await sha256(user);
            const passHash = await sha256(pass); // Временное решение, дальше привяжем AES

            // 1. Создаем пользователя в базе (пока заглушка для Спринта 1)
            await db.ref(`users/${userHash}`).set({
                isActive: true,
                created: Date.now()
            });

            // 2. Уничтожаем инвайт (чтобы второй раз по нему не зашли)
            await db.ref(`invites/${currentInviteHash}`).remove();

            // 3. Сохраняем сессию в локальное хранилище браузера
            localStorage.setItem('ghost_session', JSON.stringify({ u: userHash, p: passHash }));
            
            // 4. Пускаем в дашборд
            window.location.hash = '#/app';
        });

        // --- 5. ВЫХОД ---
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('ghost_session');
            window.location.hash = '';
            window.location.reload();
        });

        // ==========================================
        // ИНСТРУМЕНТ АДМИНА (Только для разработчика)
        // Вызови в консоли браузера: createAdminInvite("my-secret-link")
        // ==========================================
        window.createAdminInvite = async function(tokenText) {
            const hashed = await sha256(tokenText);
            await db.ref(`invites/${hashed}`).set({ createdBy: "admin", timestamp: Date.now() });
            console.log(`✅ Инвайт создан! Твоя ссылка:\n${window.location.origin}${window.location.pathname}#/inv/${tokenText}`);
        };
    </script>
</body>
</html>
